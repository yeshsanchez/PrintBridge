<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PrintBridge</title>
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PrintBridge" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/style.css?v=3" />
  </head>
  <body>
    <div class="app">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
          </span>
          <span class="brand-name">PrintBridge</span>
          <span id="statusDot" class="dot" title="checking…"></span>
        </div>
        <button id="settingsBtn" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <!-- Hero -->
      <section class="hero">
        <h1 id="greet">Let's print</h1>
        <p class="hero-sub">Send a file to the Canon G1010 from any device on the wi-fi.</p>
      </section>

      <!-- Quick tiles -->
      <section class="tiles">
        <button class="tile tile-sky" data-pick="camera">
          <span class="tile-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
          <span class="tile-label">Camera</span>
        </button>
        <button class="tile tile-mint" data-pick="photos">
          <span class="tile-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span>
          <span class="tile-label">Photos</span>
        </button>
        <button class="tile tile-lav" data-pick="files">
          <span class="tile-ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg></span>
          <span class="tile-label">Files</span>
        </button>
      </section>

      <!-- Upload card -->
      <section class="dropzone" id="dropzone">
        <input id="fileInput" type="file" accept="application/pdf,image/jpeg,image/png" multiple hidden />
        <div class="dz-empty" id="dzEmpty">
          <span class="dz-ic"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg></span>
          <p class="dz-title">Tap to choose files</p>
          <p class="dz-hint">PDF, JPG or PNG · up to 25&nbsp;MB each · or drag &amp; drop</p>
        </div>
        <div class="dz-list" id="dzList" hidden>
          <div class="dz-list-head">
            <span id="listCount">0 files</span>
            <button type="button" id="clearAll" class="link">Clear all</button>
          </div>
          <ul id="fileList" class="file-list"></ul>
          <button type="button" id="addMore" class="add-more">+ Add more files</button>
        </div>
      </section>

      <button id="printBtn" class="print-btn" disabled>Print</button>

      <!-- Queue -->
      <section class="queue">
        <div class="queue-head">
          <h2>Queue</h2>
          <button id="refreshBtn" class="link">Refresh</button>
        </div>
        <ul id="jobs" class="jobs">
          <li class="job empty">—</li>
        </ul>
      </section>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Settings sheet -->
    <div id="settings" class="sheet-overlay">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h3>Settings</h3>
        <label class="field">
          <span>API key</span>
          <input id="tokenInput" type="password" placeholder="paste your token" autocomplete="off" />
        </label>
        <p class="field-hint">Stored only on this device. Ask whoever set up PrintBridge for the token.</p>
        <div class="sheet-actions">
          <button id="closeSettings" class="btn-ghost">Cancel</button>
          <button id="saveToken" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <script src="/app.js?v=4"></script>
  </body>
</html>
